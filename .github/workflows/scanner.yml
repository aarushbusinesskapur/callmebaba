name: Quant Scanner

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch:

permissions:
  contents: write # Needed to commit state.json back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas requests numpy
          
      - name: Test Kraken Reachability (Azure IP)
        run: |
          echo "Testing Kraken Spot API..."
          curl -sI https://api.kraken.com/0/public/Time | head -n 1
          
      - name: Run Multi-Timeframe Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python github_scanner.py
          python master_scanner.py
        
      - name: Commit and Push State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add state.json || echo "No state.json to add"
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update state.json [skip ci]" && git push)

